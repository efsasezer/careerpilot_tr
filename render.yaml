services:
  - type: web
    name: careerpilot-tr-api
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: careerpilot-tr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////var/data/careerpilot.db
      - key: CAREERPILOT_DEMO_MODE
        value: "true"
