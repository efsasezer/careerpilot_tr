services:
  - type: web
    name: careerpilot-tr-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CAREERPILOT_DEMO_MODE
        value: "true"
      - key: CAREERPILOT_ACCESS_TOKEN
        generateValue: true
  - type: web
    name: careerpilot-tr-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        value: https://careerpilot-tr-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
